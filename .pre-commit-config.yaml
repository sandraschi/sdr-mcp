# Fleet pre-commit: ruff + biome (web_sota) + hygiene. Install: pre-commit install.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome-web
        name: biome check (webapp)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        files: ^(webapp(/frontend)?|web_sota|web-sota|web|frontend|ui|web_app)/(.*\.(ts|tsx|js|jsx)|biome\.json)$
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]
